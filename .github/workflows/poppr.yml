name: PopPR

# PopPR quizzing PopPR.
#
# This deliberately differs from what `poppr init` writes for everyone else.
# A consumer's workflow is one `uses:` line pointing at the published action,
# which runs the published npm package. This repo runs the handler from SOURCE,
# so a change to gh-event.ts is exercised by the very PR that changes it. The
# alternative is testing whatever was released last, which is the one version
# guaranteed not to contain the code under review.
#
# It switches to `uses: ./` once 0.2.0 is on npm, since from then on the action
# and the package agree.
#
# Fork safety, which is the whole reason pull_request_target is tolerable here:
# the checkout below takes the BASE ref, which is the default and is this repo's
# own trusted code. Nothing from the PR head is ever checked out or executed.
# The diff arrives as text through the API. Adding `ref: ${{ github.event.pull_request.head.sha }}`
# to that checkout would hand a write token to a stranger's code, so do not.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# Keyed by comment id as well as PR: a push should supersede the run it
# interrupted, but two comments in quick succession are independent. Cancelling
# the first would kill the run that writes the success status, and nothing would
# heal it until the next push.
concurrency:
  group: poppr-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  poppr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    steps:
      # No `ref:`. This is the base branch on purpose. See the header.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - run: node dist/cli/index.js gh-event
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          POPPR_CERTIFY: "true"
