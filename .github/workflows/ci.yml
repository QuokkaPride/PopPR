name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Every OS a contributor plausibly develops on. Windows is here because the
    # project was built and tested only on macOS, and the things that broke were
    # exactly the things no amount of reading catches: npm installs its global
    # CLIs as .cmd shims that Node refuses to exec, and cmd.exe never expands the
    # glob `npm test` used to depend on. Both were invisible until a job ran.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `npm test` is build, then the bank audit, then the node:test suites.
      # The audit is the gate that matters most: it fails if the correct answer
      # is the longest option too often, which is how multiple choice quietly
      # becomes gameable without anyone noticing. The suites cover the certify
      # rules, and those decide who can turn the gate green, so they have to run
      # on a PR rather than at release time.
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Quick mode must work with no API key, no network and no Claude Code.
      # If this step ever needs a secret, the default path has regressed.
      - run: node dist/cli/index.js --help
